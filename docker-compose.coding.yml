# Optional coding-assessment stack: execution dispatcher + Judge0 (isolate sandbox).
#
# Usage:  docker compose -f docker-compose.yml -f docker-compose.coding.yml up -d --build
#
# Network segmentation (T08, T19):
#   - judge0-* containers live strictly on `lancast_execution` (cannot reach `postgres` or `traefik`).
#   - `dispatcher` holds NO database credentials; it reads jobs from Redis (`lancast_internal`),
#     calls Judge0 (`lancast_execution`), and posts results to the API with X-Worker-Token.
#   - `judge0-server` / `judge0-worker` require `privileged: true` for `isolate`; physical RAM is
#     capped via `mem_limit` while `MAX_MEMORY_LIMIT` gives OpenJDK/V8 virtual RLIMIT_AS headroom.

services:
  dispatcher:
    build:
      context: ./execution
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_BASE_URL: http://api:8000
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-dev-only-worker-secret-change-me}
      JUDGE0_URL: http://judge0-server:2358
      WORKER_ID: ${WORKER_ID:-dispatcher-1}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-standalone}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_internal
      - lancast_execution

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/server"]
    privileged: true # required for inline wait=true isolate runs
    environment: &judge0_env
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0-local-password}
      ENABLE_NETWORK: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      MAX_CPU_TIME_LIMIT: "10"
      # Per-process isolate uses RLIMIT_AS (virtual address space), so OpenJDK/V8 need >=8 GB ceiling.
      MAX_MEMORY_LIMIT: "8388608"
    depends_on:
      - judge0-db
      - judge0-redis
    mem_limit: 1536m
    cpus: "2.0"
    networks:
      - lancast_execution

  judge0-worker:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true # required by isolate; see note above
    environment: *judge0_env
    depends_on:
      - judge0-db
      - judge0-redis
    mem_limit: 1536m
    cpus: "2.0"
    networks:
      - lancast_execution

  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0-local-password}
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_execution

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_execution

volumes:
  judge0_db_data:
