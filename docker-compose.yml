services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/gateway/dynamic/routes.yml:/etc/traefik/dynamic/routes.yml:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_edge

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_edge

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-standalone}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lancast:lancast@postgres:5432/lancast}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-me-in-production}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      EXECUTION_QUEUE_MAX_DEPTH: ${EXECUTION_QUEUE_MAX_DEPTH:-500}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-dev-only-worker-secret-change-me}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358}
      UPLOAD_DIR: /var/lib/lancast/uploads
    volumes:
      - uploads_data:/var/lib/lancast/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_edge
      - lancast_internal
      - lancast_execution

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lancast}
      POSTGRES_USER: ${POSTGRES_USER:-lancast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lancast}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancast} -d ${POSTGRES_DB:-lancast}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    networks:
      - lancast_internal

networks:
  lancast_edge:
    driver: bridge
  lancast_internal:
    driver: bridge
  lancast_execution:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
