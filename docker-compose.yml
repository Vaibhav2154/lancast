services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/gateway/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - api
      - web
    networks:
      - lancast_internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - lancast_internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-standalone}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lancast:lancast@postgres:5432/lancast}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-me-in-production}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      EXECUTION_QUEUE_MAX_DEPTH: ${EXECUTION_QUEUE_MAX_DEPTH:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lancast_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lancast}
      POSTGRES_USER: ${POSTGRES_USER:-lancast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lancast}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancast} -d ${POSTGRES_DB:-lancast}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lancast_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lancast_internal

networks:
  lancast_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
