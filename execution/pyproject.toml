[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lancast-execution"
version = "0.1.0"
description = "LANCAST execution dispatcher: consumes the bounded queue and runs jobs in a sandbox"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dispatcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
