name: LANCAST CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: Backend (Lint, Tests on PostgreSQL, Migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lancast
          POSTGRES_PASSWORD: lancast
          POSTGRES_DB: lancast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lancast -d lancast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lancast:lancast@localhost:5432/lancast_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests alembic

      - name: Migrate a clean database and check for model/migration drift
        run: |
          alembic upgrade head
          alembic check

      - name: Verify downgrade/upgrade round-trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest against real PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://lancast:lancast@localhost:5432/lancast_test
        run: pytest -v

      - name: Run Pytest on SQLite (fast path)
        run: pytest -q

  execution:
    name: Execution worker (Lint & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check dispatcher tests

      - name: Run Pytest
        run: pytest -v

  web:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Typecheck and build SPA
        run: npm run build

  compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate coding override
        run: docker compose -f docker-compose.yml -f docker-compose.coding.yml config --quiet

      - name: Validate standalone profile
        run: docker compose -f docker-compose.yml -f docker-compose.coding.yml -f infrastructure/profiles/standalone/compose.standalone.yml config --quiet

      - name: Validate central server & worker profiles
        run: |
          docker compose -f docker-compose.yml -f infrastructure/profiles/central/compose.server.yml config --quiet
          docker compose -f infrastructure/profiles/central/compose.worker.yml config --quiet

      - name: Validate TLS gateway overlay
        run: docker compose -f docker-compose.yml -f infrastructure/gateway/compose.tls.yml config --quiet

      - name: Validate monitoring stack overlay
        run: docker compose -f docker-compose.yml -f docker-compose.coding.yml -f docker-compose.monitoring.yml config --quiet

      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infrastructure/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infrastructure/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
