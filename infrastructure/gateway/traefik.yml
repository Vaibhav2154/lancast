# Traefik static configuration for LANCAST gateway
# Uses file provider (no Docker socket mount required).

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  worker:
    address: ":8081"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true

api:
  dashboard: false
  insecure: false

ping: {}
